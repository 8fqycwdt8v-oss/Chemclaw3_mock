[project]
name = "chemclaw3-mock"
version = "0.1.0"
description = "Lightweight FastAPI mock backend (HPC launcher, ELN datasources, MCP tool) for testing Chemclaw3 without real infrastructure."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    # The upper bound is load-bearing: mcp 2.0 removed `mcp.server.fastmcp`, the module
    # `app/mcp_tools/vendor_server.py` imports `FastMCP` from, with no shim. Unbounded, a
    # fresh install resolves 2.x and mock-vendor dies at import with no code change here at
    # all. Chemclaw3-mcp's own mcp-server-kit pins the same way for the same reason.
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
